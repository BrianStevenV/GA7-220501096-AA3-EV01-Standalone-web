<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<h1>User Form</h1>


<div th:if="${action == 'getUser'}">
    <h2>Get User by ID</h2>
    <form action="/user" method="get">
        <label for="userId">User ID:</label>
        <input type="number" id="userId" name="id" required>
        <button type="submit">Fetch User</button>
    </form>


    <div th:if="${user != null}">
        <h3>User Details</h3>
        <p><strong>ID:</strong> <span th:text="${user.id}"></span></p>
        <p><strong>Name:</strong> <span th:text="${user.name}"></span></p>
        <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
    </div>


    <div th:if="${user == null}">
        <p style="color: red;">User not found.</p>
    </div>
    <div>
        <a href="http://localhost:8080">Back</a>
    </div>
</div>



<div th:if="${action == 'createUser'}">
    <h2>Create a New User</h2>
    <form action="/user" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <button type="submit">Save User</button>
    </form>
    <div>
        <a href="http://localhost:8080">Back</a>
    </div>
</div>


<div th:if="${action == 'getAllUsers'}">
    <h2>All Users</h2>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
        </tr>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.name}"></td>
            <td th:text="${user.email}"></td>
        </tr>
    </table>
    <div>
        <a href="http://localhost:8080">Back</a>
    </div>
</div>


<div th:if="${action == 'updateUser'}">
    <h2>Update User</h2>


    <form action="/user" method="get">
        <label for="updateId">User ID:</label>
        <input type="number" id="updateId" name="id" required>
        <input type="hidden" name="action" value="updateUser">
        <button type="submit">Search User</button>
    </form>

    <div>
        <a href="http://localhost:8080">Back</a>
    </div>


    <div th:if="${searched}">
        <div th:if="${user != null}">
            <h3>Edit User</h3>
            <form action="/user" method="post">
                <input type="hidden" name="_method" value="PUT">
                <input type="hidden" name="id" th:value="${user.id}">

                <label for="updateName">New Name:</label>
                <input type="text" id="updateName" name="name" th:value="${user.name}" required>

                <label for="updateEmail">New Email:</label>
                <input type="email" id="updateEmail" name="email" th:value="${user.email}" required>

                <button type="submit">Update User</button>
            </form>
        </div>

        <div th:if="${user == null}">
            <p style="color: red;">User not found.</p>
        </div>

        <div>
            <a href="http://localhost:8080">Back</a>
        </div>
    </div>

</div>


<div th:if="${action == 'deleteUser'}">
    <h2>Delete User</h2>
    <form action="/user" method="post">
        <label for="deleteId">User ID:</label>
        <input type="number" id="deleteId" name="id" required>
        <button type="submit">Delete User</button>
    </form>
    <div>
        <a href="http://localhost:8080">Back</a>
    </div>
</div>

</body>
</html>
